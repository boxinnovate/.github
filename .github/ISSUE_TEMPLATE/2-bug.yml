name: Bug (not in production)
description: Defect found on local, test or demo.
labels: ["bug"]
projects: ["boxinnovate/1"]
body:
  - type: markdown
    attributes:
      value: "**No customer names, emails or personal data. Tenant / exam ids only.** Seen on acadwin.ai or minerva.academy? Use **Production bug** instead."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you see. Tenant / exam ids, screen.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it happened
      description: Steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Files / routes, if known.
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the fix
